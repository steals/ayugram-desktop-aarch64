name: Bump AyuGram version

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Force version (without v), empty = latest release"
        required: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      SPEC: ayugram-desktop/ayugram-desktop.spec
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install tools
        run: dnf -y install git gh jq rpmdevtools copr-cli

      - uses: actions/checkout@v4

      - name: Resolve versions
        id: v
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          current=$(rpmspec -q --srpm --qf '%{version}' "$SPEC")
          latest="${{ inputs.version }}"
          if [ -z "$latest" ]; then
            latest=$(gh api repos/AyuGram/AyuGramDesktop/releases/latest --jq .tag_name)
            latest=${latest#v}
          fi
          echo "current=$current latest=$latest"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Check full source tarball exists
        if: steps.v.outputs.current != steps.v.outputs.latest
        run: |
          v=${{ steps.v.outputs.latest }}
          gh api "repos/AyuGram/AyuGramDesktop/releases/tags/v$v" \
            --jq '.assets[].name' | grep -qx "AyuGramDesktop-$v-full.tar.gz" \
            || { echo "::error::No AyuGramDesktop-$v-full.tar.gz in release v$v"; exit 1; }

      - name: Update spec and push
        if: steps.v.outputs.current != steps.v.outputs.latest
        run: |
          v=${{ steps.v.outputs.latest }}
          rpmdev-bumpspec -n "$v" -c "Update to $v" \
            -u "github-actions <github-actions@users.noreply.github.com>" "$SPEC"
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -am "ayugram-desktop: update to $v"
          git push

      - name: Trigger COPR build
        if: steps.v.outputs.current != steps.v.outputs.latest
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT }}
        run: |
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          copr-cli build-package "$COPR_PROJECT" --name ayugram-desktop \
            --timeout 108000 --nowait
